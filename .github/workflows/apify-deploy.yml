# Deploy this Actor to Apify on every push to main.
#
# Verified 2026-09-08:
#   - apify/push-actor-action@v1 exists (latest release v1.1.4); the action file is
#     action.yaml. It runs setup-apify-cli-action@v1 then `apify push`.
#   - It does NOT pass --force. That's fine: actions/checkout sets file mtimes to
#     checkout time, so the CLI's "modified on platform since local" guard passes.
#   - `apify push` on an existing Actor updates only
#     {tarballUrl, sourceFiles, buildTag, sourceType, envVars}. Store title/description
#     are sent only on actors().create(), so live SEO titles are not touched.
#   - version + buildTag come from .actor/actor.json (all 14 are set correctly).
#
# paths-ignore covers .github/** only, so adding this file does not itself deploy,
# but README/llms.txt changes DO deploy (the store listing is built from the README).

name: Deploy to Apify

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:
    inputs:
      build_tag:
        description: 'Build tag for a staging build, e.g. beta (default: latest from .actor/actor.json). Run it with build=beta; users keep running latest.'
        required: false

concurrency:
  group: apify-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The actor is pinned by ID (.actor/store.json actorId), so a rename of
      # actor.json "name" updates the same actor instead of creating a new one.
      - name: Read actor ID
        id: meta
        run: echo "actor_id=$(node -p "require('./.actor/store.json').actorId || ''")" >> "$GITHUB_OUTPUT"

      - name: Push Actor to Apify
        id: push
        uses: apify/push-actor-action@v1
        with:
          token: ${{ secrets.APIFY_TOKEN }}
          actor-id: ${{ steps.meta.outputs.actor_id }}
          build-tag: ${{ inputs.build_tag }}

      - name: Report build
        run: |
          echo "build ${{ steps.push.outputs.build-number }} -> ${{ steps.push.outputs.build-status }}"
          test "${{ steps.push.outputs.build-status }}" = "SUCCEEDED"

      # apify push never updates the Store listing of an existing Actor (title,
      # description, SEO fields, categories, permissions, example input, run
      # defaults). This keeps GitHub the source of truth for the listing too.
      - name: Sync Store listing metadata
        if: ${{ !inputs.build_tag }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/store-metadata.mjs

      # Example tasks are Store landing pages of their own (Google-indexed, with a .md for AI agents).
      # Created and updated from .actor/tasks.json; never deleted.
      - name: Publish example tasks
        if: ${{ !inputs.build_tag }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/publish-tasks.mjs

  # List this Actor in the official MCP Registry, pointing at Apify's hosted MCP
  # endpoint (callers bring their own Apify token, so runs bill as usual).
  # Runs only after a successful deploy. GitHub OIDC proves io.github.<owner>/*,
  # so no secret is needed. The registry rejects a repeated version, so the patch
  # number is the workflow run number (see scripts/mcp-server-json.mjs).
  mcp-registry:
    needs: deploy
    if: ${{ !inputs.build_tag }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build server.json
        run: node scripts/mcp-server-json.mjs > server.json && cat server.json

      - name: Install mcp-publisher
        run: curl -sSfL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
